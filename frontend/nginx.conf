server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 55m;            # PDF до 50 МБ

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;         # генерация карточки и ход интервью ждут ответа LLM
    }

    location / {
        try_files $uri /index.html;      # SPA: все маршруты отдаёт index.html
    }
}
