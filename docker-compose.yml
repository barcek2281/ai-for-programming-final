services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: vivamind
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql"]   # в PG18 монтируется родительская папка
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d vivamind"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: mini -dir=/data -s3.config=/etc/seaweedfs/s3.json -bucket=vivamind -admin.port=12646
    ports: ["8333:8333", "12646:12646"]  # 8333 — S3 API, 12646 — админка
    volumes:
      - seaweed-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vivamind
      S3_ENDPOINT: http://seaweedfs:8333
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    ports: ["8080:8080"]

  frontend:
    build: ./frontend          # nginx отдаёт статику и проксирует /api → backend:8080
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  pg-data:
  seaweed-data:
